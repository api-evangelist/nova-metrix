description: Nova Metrix is a geotechnical, environmental, and materials-testing instrumentation company
  headquartered in Wakefield, Massachusetts and founded in 2009. It designs and manufactures sensors,
  instruments, monitoring software, and consumables for structural-health monitoring, construction, civil
  engineering, energy, and medical markets, operating in more than 90 countries. Nova Metrix is the parent
  of a family of specialist geotechnical and fiber-optic brands including Roctest, Sensornet, Sherborne
  Sensors, Soil Instruments, Westbay Instruments, DGSI, Waterloo Hydrogeologic, and Van Essen Instruments.
  It is backed by Battery Ventures, Commonwealth Capital, and Ascent Venture Partners. As of this
  enrichment pass Nova Metrix publishes no public developer API, developer portal, or machine-readable
  API artifacts; this profile carries verified company identity rather than an API surface.
